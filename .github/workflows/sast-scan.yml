name: Static Application Security Testing (SAST)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  security-events: write
  contents: read

jobs:
  semgrep-sast:
    name: Semgrep SAST & Secret Scan
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Run Semgrep Security Scan
      uses: semgrep/semgrep-action@v1
      with:
        config: >-
          p/security-audit
          p/secrets
          p/python
        # Use the official metric flag to write out the sarif file path correctly
        pub: false
      env:
        SEMGREP_SARIF_FILE: "semgrep.sarif"
