name: Generate Repository Knowledge Graph

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  graphify-build:
    name: Build & Verify Graph
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Graphify
      run: |
        python -m pip install --upgrade pip
        pip install graphifyy

    - name: Generate Knowledge Graph (Code-Only)
      run: |
        graphify . --code-only

    - name: Upload Graph Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: repository-graph
        path: graphify-out/