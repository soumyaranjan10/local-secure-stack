apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-app
  namespace: demo-namespace
  labels:
    app: fastapi
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fastapi
  template:
    metadata:
      labels:
        app: fastapi
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: fastapi
        image: local-fastapi:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        # SECURITY: Provide a secure, isolated scratch space for temporary files
        volumeMounts:
        - mountPath: /tmp
          name: temp-dir
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
      # Define the ephemeral volume backed by node memory/storage
      volumes:
      - name: temp-dir
        emptyDir: {}